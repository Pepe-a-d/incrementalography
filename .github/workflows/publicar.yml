# Publica la web en GitHub Pages con cada push a main: la página de descarga (site/) en la raíz
# y el juego para el navegador en /play/
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación detrás de otra, sin cortar la que esté en marcha
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # the website doesn't need the desktop app
      - name: Construir el juego
        run: npm run build -- --base=/${{ github.event.repository.name }}/play/
      - name: Juntar la página de descarga y el juego
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R dist _site/play
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
